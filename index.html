<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EL OULA SCHOOL - منصة بطاقات الطلاب</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Poppins:wght@500;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary-glow: #8b5cf6;
      --secondary-glow: #ec4899;
      --glass-bg: rgba(15, 23, 42, 0.65);
      --glass-border: rgba(255, 255, 255, 0.15);
      --glass-card: rgba(255, 255, 255, 0.1);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }

    body {
      background: #0f172a;
      min-height: 100vh;
      color: #f8fafc;
      padding-bottom: 50px;
      position: relative;
      overflow-x: hidden;
    }

    /* خلفية متدرجة ذات مؤثرات إضاءة زجاجية (Glow effects) */
    body::before, body::after {
      content: '';
      position: absolute;
      width: 400px;
      height: 400px;
      border-radius: 50%;
      filter: blur(120px);
      z-index: -1;
    }
    body::before { background: var(--primary-glow); top: -50px; left: -50px; }
    body::after { background: var(--secondary-glow); bottom: 50px; right: -50px; }

    /* الهيدر الزجاجي الاحترافي */
    header {
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--glass-border);
      padding: 1rem 3rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 4px 30px rgba(0, 0, 0, 0.3);
    }

    .brand-container { display: flex; align-items: center; gap: 18px; }
    .brand-logo { 
      width: 55px; 
      height: 55px; 
      object-fit: contain; 
      background: #fff; 
      border-radius: 12px; 
      padding: 4px;
      box-shadow: 0 0 15px rgba(236, 72, 153, 0.4);
    }
    .brand-text .site-title { font-size: 1.5rem; font-weight: 800; letter-spacing: 0.5px; background: linear-gradient(to right, #fff, #cbd5e1); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .brand-text .site-subtitle { font-size: 0.8rem; color: #94a3b8; font-weight: 600; }

    .container {
      max-width: 1250px;
      margin: 40px auto;
      padding: 0 20px;
      display: grid;
      grid-template-columns: 400px 1fr;
      gap: 35px;
    }

    @media (max-width: 992px) { .container { grid-template-columns: 1fr; } }

    /* لوحة التحكم بالنوافذ الزجاجية */
    .glass-panel {
      background: var(--glass-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--glass-border);
      border-radius: 24px;
      padding: 30px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
    }

    .section-title {
      font-size: 1.1rem;
      font-weight: 800;
      margin-bottom: 20px;
      color: #38bdf8;
      border-right: 4px solid #38bdf8;
      padding-right: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .form-group { margin-bottom: 18px; }
    .form-group label { display: block; font-size: 0.85rem; font-weight: 700; margin-bottom: 8px; color: #e2e8f0; }
    .form-group input {
      width: 100%;
      padding: 12px 16px;
      border: 1px solid var(--glass-border);
      background: rgba(30, 41, 59, 0.7);
      border-radius: 12px;
      font-size: 0.9rem;
      color: #fff;
      outline: none;
      transition: all 0.3s ease;
    }
    .form-group input:focus { 
      border-color: #38bdf8; 
      box-shadow: 0 0 12px rgba(56, 189, 248, 0.3);
      background: rgba(30, 41, 59, 0.9);
    }

    .file-dropzone {
      border: 2px dashed #a855f7;
      background: rgba(168, 85, 247, 0.1);
      border-radius: 14px;
      padding: 20px;
      text-align: center;
      cursor: pointer;
      margin-bottom: 25px;
      color: #e2e8f0;
      font-weight: 600;
      transition: all 0.3s;
    }
    .file-dropzone:hover { 
      background: rgba(168, 85, 247, 0.2); 
      border-color: #ec4899;
      box-shadow: 0 0 15px rgba(236, 72, 153, 0.2);
    }

    /* منطقة معاينة البطاقة مع تصميم الأبعاد الفعلي */
    .cards-preview-area {
      display: flex;
      flex-direction: column;
      gap: 35px;
      align-items: center;
    }

    .card-wrapper {
      position: relative;
      width: 520px;
      height: 325px;
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 20px 50px rgba(0,0,0,0.6);
      border: 1px solid rgba(255,255,255,0.2);
      transition: transform 0.3s ease;
    }
    .card-wrapper:hover { transform: translateY(-5px); }

    /* الوجه الأمامي */
    .card-front {
      width: 100%;
      height: 100%;
      position: relative;
      background-size: cover;
      background-position: center;
    }

    .student-photo-overlay {
      position: absolute;
      top: 136px;
      left: 31px;
      width: 118px;
      height: 126px;
      object-fit: cover;
      border-radius: 4px;
    }

    .field-overlay {
      position: absolute;
      font-weight: 700;
      color: #000;
      font-size: 13px;
      font-family: 'Poppins', sans-serif;
      white-space: nowrap;
    }

    /* تموضع النصوص على تصميم البطاقة الأصلي */
    #valName { top: 128px; left: 240px; }
    #valLevel { top: 168px; left: 240px; }
    #valId { top: 209px; left: 240px; }
    #valExpire { top: 252px; left: 240px; }

    /* الظهر */
    .card-back {
      width: 100%;
      height: 100%;
      background-size: cover;
      background-position: center;
    }
  </style>
</head>
<body>

  <header>
    <div class="brand-container">
      <div class="brand-text">
        <div class="site-title">EL OULA SCHOOL</div>
        <div class="site-subtitle">ECOLE DE LANGUES ET DE FORMATION - منصة بطاقات الطلاب الاحترافية</div>
      </div>
    </div>
  </header>

  <div class="container">
    
    <!-- لوحة التحكم زجاجية -->
    <div class="glass-panel">
      <div class="section-title">📁 رفع البيانات الحجمية</div>
      <div class="file-dropzone" onclick="document.getElementById('bulkFile').click()">
        اضغط لرفع حزمة بيانات (Excel / PDF / ZIP)
        <input type="file" id="bulkFile" hidden accept=".xlsx, .xls, .csv, .pdf, .zip">
      </div>

      <div class="section-title">✏️ بيانات الطالب الحالية</div>
      
      <div class="form-group">
        <label>اسم الطالب (NAME)</label>
        <input type="text" id="inputName" placeholder="MOHAMED BENALI" oninput="updateCard()">
      </div>

      <div class="form-group">
        <label>المستوى الدراسي (ACADEMIC LEVEL)</label>
        <input type="text" id="inputLevel" placeholder="2ND YEAR HIGH SCHOOL" oninput="updateCard()">
      </div>

      <div class="form-group">
        <label>الرقم التعريفي (ID)</label>
        <input type="text" id="inputId" placeholder="2026-0089" oninput="updateCard()">
      </div>

      <div class="form-group">
        <label>تاريخ الانتهاء (EXPIRE DATE)</label>
        <input type="text" id="inputExpire" placeholder="06 / 2027" oninput="updateCard()">
      </div>

      <div class="form-group">
        <label>صورة الطالب الشخصية</label>
        <input type="file" id="inputPhoto" accept="image/*" onchange="previewPhoto(event)">
      </div>
    </div>

    <!-- المعاينة الحية المباشرة -->
    <div class="cards-preview-area">
      
      <!-- الوجه الأمامي للبطاقة -->
      <div class="card-wrapper">
        <div class="card-front" id="cardFrontBg">
          <img id="cardPhoto" class="student-photo-overlay" src="" style="display:none;">
          
          <!-- القيم النصية الظاهرة في الخانات -->
          <div class="field-overlay" id="valName">---</div>
          <div class="field-overlay" id="valLevel">---</div>
          <div class="field-overlay" id="valId">---</div>
          <div class="field-overlay" id="valExpire">---</div>
        </div>
      </div>

      <!-- الظهر للبطاقة -->
      <div class="card-wrapper">
        <div class="card-back" id="cardBackBg"></div>
      </div>

    </div>

  </div>

  <script>
    // ربط خلفية البطاقة الوجه والظهر مباشرة بكود الصفحة
    document.getElementById('cardFrontBg').style.backgroundImage = "url('1_2.png')";
    document.getElementById('cardBackBg').style.backgroundImage = "url('2_2.png')";

    function updateCard() {
      document.getElementById('valName').innerText = document.getElementById('inputName').value || '---';
      document.getElementById('valLevel').innerText = document.getElementById('inputLevel').value || '---';
      document.getElementById('valId').innerText = document.getElementById('inputId').value || '---';
      document.getElementById('valExpire').innerText = document.getElementById('inputExpire').value || '---';
    }

    function previewPhoto(event) {
      const file = event.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(e) {
          const img = document.getElementById('cardPhoto');
          img.src = e.target.result;
          img.style.display = 'block';
        }
        reader.readAsDataURL(file);
      }
    }
  </script>

</body>
</html>
