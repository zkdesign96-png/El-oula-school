<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EL OULA SCHOOL - منصة بطاقات الطلاب</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Poppins:wght@500;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --glass-bg: rgba(15, 23, 42, 0.7);
      --glass-border: rgba(255, 255, 255, 0.15);
      --accent-color: #38bdf8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }

    body {
      background: #090d16;
      min-height: 100vh;
      color: #f8fafc;
      padding-bottom: 50px;
      position: relative;
      overflow-x: hidden;
    }

    /* خلفيات ضوئية متحركة */
    .orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(90px);
      opacity: 0.6;
      animation: floatOrb 10s infinite alternate ease-in-out;
      z-index: -1;
    }

    .orb-1 { width: 350px; height: 350px; background: #8b5cf6; top: -50px; right: -50px; }
    .orb-2 { width: 400px; height: 400px; background: #ec4899; bottom: 50px; left: -100px; animation-delay: -3s; }
    .orb-3 { width: 300px; height: 300px; background: #06b6d4; top: 40%; right: 30%; animation-delay: -6s; }

    @keyframes floatOrb {
      0% { transform: translate(0, 0) scale(1); }
      100% { transform: translate(40px, 50px) scale(1.15); }
    }

    /* الهيدر الزجاجي - اسم الصفحة واللوجو متموقعين في الوسط تماماً */
    header {
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--glass-border);
      padding: 1rem 2rem;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5);
    }

    .header-center {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 6px;
    }

    .page-title {
      font-size: 1rem;
      font-weight: 700;
      color: var(--accent-color);
      letter-spacing: 0.5px;
    }

    .header-logo {
      width: 70px;
      height: 70px;
      object-fit: contain;
      background: rgba(255, 255, 255, 0.95);
      border-radius: 14px;
      padding: 6px;
      box-shadow: 0 0 25px rgba(56, 189, 248, 0.4);
      margin: 2px 0;
    }

    .school-title {
      font-size: 1.3rem;
      font-weight: 800;
      color: #ffffff;
      font-family: 'Poppins', 'Cairo', sans-serif;
      line-height: 1.1;
    }

    .school-subtitle {
      font-size: 0.75rem;
      color: #94a3b8;
      font-weight: 600;
    }

    .container {
      max-width: 1250px;
      margin: 30px auto;
      padding: 0 20px;
      display: grid;
      grid-template-columns: 380px 1fr;
      gap: 35px;
    }

    @media (max-width: 992px) { .container { grid-template-columns: 1fr; } }

    /* لوحة التحكم والمدخلات */
    .glass-panel {
      background: var(--glass-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--glass-border);
      border-radius: 20px;
      padding: 25px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.4);
    }

    .section-title {
      font-size: 1rem;
      font-weight: 800;
      margin-bottom: 15px;
      color: var(--accent-color);
      border-right: 4px solid var(--accent-color);
      padding-right: 10px;
    }

    .form-group { margin-bottom: 15px; }
    .form-group label { display: block; font-size: 0.8rem; font-weight: 700; margin-bottom: 6px; color: #e2e8f0; }
    .form-group input {
      width: 100%;
      padding: 10px 14px;
      border: 1px solid var(--glass-border);
      background: rgba(30, 41, 59, 0.7);
      border-radius: 10px;
      font-size: 0.85rem;
      color: #fff;
      outline: none;
      transition: all 0.3s;
    }
    .form-group input:focus { border-color: var(--accent-color); box-shadow: 0 0 10px rgba(56, 189, 248, 0.3); }

    .file-dropzone {
      border: 2px dashed #ec4899;
      background: rgba(236, 72, 153, 0.1);
      border-radius: 12px;
      padding: 15px;
      text-align: center;
      cursor: pointer;
      margin-bottom: 20px;
      color: #e2e8f0;
      font-size: 0.85rem;
      font-weight: 600;
      transition: 0.3s;
    }
    .file-dropzone:hover { background: rgba(236, 72, 153, 0.2); }

    .btn-print {
      width: 100%;
      padding: 12px;
      background: linear-gradient(135deg, #06b6d4, #3b82f6);
      border: none;
      border-radius: 10px;
      color: white;
      font-weight: 800;
      font-size: 0.95rem;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(6, 182, 212, 0.4);
      transition: all 0.3s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .btn-print:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(6, 182, 212, 0.6); }

    /* معاينة البطاقات */
    .cards-preview-area {
      display: flex;
      flex-direction: column;
      gap: 30px;
      align-items: center;
    }

    .card-wrapper {
      position: relative;
      width: 500px;
      height: 315px;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 15px 35px rgba(0,0,0,0.6);
      border: 1px solid rgba(255,255,255,0.2);
    }

    .card-front, .card-back {
      width: 100%;
      height: 100%;
      background-size: 100% 100%;
      background-position: center;
      position: relative;
    }

    .student-photo-overlay {
      position: absolute;
      top: 132px;
      left: 30px;
      width: 114px;
      height: 122px;
      object-fit: cover;
      border-radius: 4px;
    }

    .field-overlay {
      position: absolute;
      font-weight: 700;
      color: #000;
      font-size: 12.5px;
      font-family: 'Poppins', sans-serif;
      white-space: nowrap;
    }

    #valName { top: 124px; left: 232px; }
    #valLevel { top: 163px; left: 232px; }
    #valId { top: 202px; left: 232px; }
    #valExpire { top: 244px; left: 232px; }

    @media print {
      body * { visibility: hidden; }
      .cards-preview-area, .cards-preview-area * { visibility: visible; }
      .cards-preview-area { position: absolute; top: 0; left: 0; width: 100%; gap: 20px; }
      .card-wrapper { page-break-after: always; box-shadow: none; border: none; }
    }
  </style>
</head>
<body>

  <!-- مؤثرات خلفية متحركة -->
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="orb orb-3"></div>

  <!-- الهيدر: عنوان الصفحة في الوسط تماماً حول الشعار -->
  <header>
    <div class="header-center">
      <div class="page-title">منصة إنشاء واستخراج بطاقات الطلاب</div>
      <img src="Untitled design_2.png" alt="Logo" class="header-logo" onerror="this.src='https://via.placeholder.com/70?text=LOGO'">
      <div class="school-title">EL OULA SCHOOL</div>
      <div class="school-subtitle">ECOLE DE LANGUES ET DE FORMATION</div>
    </div>
  </header>

  <div class="container">
    
    <!-- لوحة التحكم -->
    <div class="glass-panel">
      <div class="section-title">📁 رفع ملفات البيانات</div>
      <div class="file-dropzone" onclick="document.getElementById('bulkFile').click()">
        اضغط لرفع ملف (Excel / PDF / ZIP)
        <input type="file" id="bulkFile" hidden accept=".xlsx, .xls, .csv, .pdf, .zip">
      </div>

      <div class="section-title">✏️ بيانات الطالب الحالية</div>
      
      <div class="form-group">
        <label>اسم الطالب (NAME)</label>
        <input type="text" id="inputName" placeholder="MOHAMED BENALI" oninput="updateCard()">
      </div>

      <div class="form-group">
        <label>المستوى الدراسي (ACADEMIC LEVEL)</label>
        <input type="text" id="inputLevel" placeholder="2ND YEAR HIGH SCHOOL" oninput="updateCard()">
      </div>

      <div class="form-group">
        <label>الرقم التعريفي (ID)</label>
        <input type="text" id="inputId" placeholder="2026-0089" oninput="updateCard()">
      </div>

      <div class="form-group">
        <label>تاريخ الانتهاء (EXPIRE DATE)</label>
        <input type="text" id="inputExpire" placeholder="06 / 2027" oninput="updateCard()">
      </div>

      <div class="form-group">
        <label>صورة الطالب الشخصية</label>
        <input type="file" id="inputPhoto" accept="image/*" onchange="previewPhoto(event)">
      </div>

      <button class="btn-print" onclick="window.print()">🖨️ طباعة بطاقة الطالب</button>
    </div>

    <!-- المعاينة الحية للبطاقة -->
    <div class="cards-preview-area">
      
      <!-- الوجه الأمامي -->
      <div class="card-wrapper">
        <div class="card-front" id="cardFrontBg">
          <img id="cardPhoto" class="student-photo-overlay" src="" style="display:none;">
          
          <div class="field-overlay" id="valName">---</div>
          <div class="field-overlay" id="valLevel">---</div>
          <div class="field-overlay" id="valId">---</div>
          <div class="field-overlay" id="valExpire">---</div>
        </div>
      </div>

      <!-- الظهر -->
      <div class="card-wrapper">
        <div class="card-back" id="cardBackBg"></div>
      </div>

    </div>

  </div>

  <script>
    document.getElementById('cardFrontBg').style.backgroundImage = "url('1_2.png')";
    document.getElementById('cardBackBg').style.backgroundImage = "url('2_2.png')";

    function updateCard() {
      document.getElementById('valName').innerText = document.getElementById('inputName').value || '---';
      document.getElementById('valLevel').innerText = document.getElementById('inputLevel').value || '---';
      document.getElementById('valId').innerText = document.getElementById('inputId').value || '---';
      document.getElementById('valExpire').innerText = document.getElementById('inputExpire').value || '---';
    }

    function previewPhoto(event) {
      const file = event.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(e) {
          const img = document.getElementById('cardPhoto');
          img.src = e.target.result;
          img.style.display = 'block';
        }
        reader.readAsDataURL(file);
      }
    }
  </script>

</body>
</html>
