<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EL OULA SCHOOL - Smart ID Portal</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=Poppins:wght@700;800;900&display=swap" rel="stylesheet">
  
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

  <style>
    :root {
      --primary-cyan: #06b6d4;
      --accent-purple: #8b5cf6;
      --accent-pink: #ec4899;
      --accent-green: #10b981;
      --glass-bg: rgba(15, 23, 42, 0.55);
      --glass-border: rgba(255, 255, 255, 0.15);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }

    body {
      background-color: #030712;
      min-height: 100vh;
      color: #f8fafc;
      padding-bottom: 60px;
      position: relative;
      overflow-x: hidden;
    }

    .bg-pattern {
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      z-index: 0;
      background-color: #030712;
      background-image: 
        radial-gradient(circle at 50% 50%, rgba(139, 92, 246, 0.15) 0%, transparent 70%),
        radial-gradient(rgba(255, 255, 255, 0.12) 1.5px, transparent 1.5px);
      background-size: 100% 100%, 35px 35px;
      pointer-events: none;
    }

    header {
      width: 100%;
      padding: 2rem 1rem;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      position: relative;
      z-index: 10;
    }

    .header-content { display: flex; flex-direction: column; align-items: center; }
    .site-title { font-size: 2.2rem; font-weight: 900; color: #ffffff; font-family: 'Poppins', sans-serif; }
    .site-subtitle { font-size: 0.95rem; color: var(--primary-cyan); font-weight: 700; margin-top: 4px; }

    .main-container {
      max-width: 1400px;
      margin: 10px auto;
      padding: 0 20px;
      display: grid;
      grid-template-columns: 400px 1fr;
      gap: 30px;
      position: relative;
      z-index: 10;
    }

    @media (max-width: 1024px) { .main-container { grid-template-columns: 1fr; } }

    .control-panel {
      background: var(--glass-bg);
      backdrop-filter: blur(16px);
      border: 1px solid var(--glass-border);
      border-radius: 24px;
      padding: 25px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.5);
    }

    .panel-title {
      font-size: 1.05rem;
      font-weight: 800;
      margin-bottom: 18px;
      color: var(--primary-cyan);
      border-right: 4px solid var(--primary-cyan);
      padding-right: 10px;
    }

    .form-group { margin-bottom: 14px; }
    .form-group label { display: block; font-size: 0.85rem; font-weight: 700; margin-bottom: 6px; color: #cbd5e1; }
    .form-group input, .form-group select {
      width: 100%;
      padding: 10px 14px;
      border: 1px solid var(--glass-border);
      background: rgba(15, 23, 42, 0.6);
      border-radius: 12px;
      font-size: 0.9rem;
      color: #fff;
      outline: none;
    }

    .action-section { margin-top: 15px; display: flex; flex-direction: column; gap: 12px; }

    .btn-action {
      width: 100%;
      padding: 14px 18px;
      border: 1px solid var(--glass-border);
      border-radius: 14px;
      color: white;
      font-weight: 800;
      font-size: 0.92rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: all 0.3s ease;
    }

    .btn-batch { background: linear-gradient(135deg, rgba(16, 185, 129, 0.9), rgba(6, 182, 212, 0.9)); }
    .btn-print-batch { background: linear-gradient(135deg, rgba(236, 72, 153, 0.9), rgba(139, 92, 246, 0.9)); }
    .btn-download { background: linear-gradient(135deg, rgba(16, 185, 129, 0.8), rgba(6, 182, 212, 0.8)); }
    .btn-clear { background: rgba(239, 68, 68, 0.35); border-color: rgba(239, 68, 68, 0.6); }

    .cards-grid { display: flex; flex-direction: column; gap: 30px; align-items: center; }

    .card-box {
      display: flex;
      flex-direction: row;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      gap: 20px;
      background: rgba(255,255,255,0.02);
      padding: 20px;
      border-radius: 20px;
      border: 1px solid var(--glass-border);
      width: 100%;
    }

    .card-wrapper {
      position: relative;
      width: 480px;
      height: 300px;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 15px 35px rgba(0,0,0,0.8);
      border: 1px solid rgba(255,255,255,0.25);
      background: #0f172a;
    }

    .card-template-img {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      object-fit: cover;
      z-index: 1;
    }

    .student-photo {
      position: absolute;
      top: 125px; left: 30px;
      width: 108px; height: 116px;
      object-fit: cover;
      border-radius: 4px;
      z-index: 2;
    }

    .field-overlay {
      position: absolute;
      font-weight: 900 !important;
      color: #000;
      font-size: 13px;
      font-family: 'Poppins', sans-serif;
      white-space: nowrap;
      z-index: 3;
    }

    .valName   { top: 110px; left: 235px; }
    .valLevel  { top: 164px; left: 235px; } 
    .valId     { top: 192px; left: 235px; } 
    .valExpire { top: 246px; left: 235px; }

    /* 🖨️ إعدادات الطباعة الرسمية (Recto / Verso) */
    @media print {
      body { background: white !important; color: black !important; padding: 0 !important; }
      .bg-pattern, header, .control-panel { display: none !important; }
      .main-container { display: block !important; width: 100% !important; margin: 0 !important; padding: 0 !important; }
      .card-box {
        border: none !important;
        background: transparent !important;
        padding: 0 !important;
        margin-bottom: 20px !important;
        page-break-inside: avoid;
      }
      .card-wrapper {
        box-shadow: none !important;
        border: 1px solid #ccc !important;
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
      }
    }
  </style>
</head>
<body>

  <div class="bg-pattern"></div>

  <header>
    <div class="header-content">
      <div class="site-title">EL OULA SCHOOL</div>
      <div class="site-subtitle">نظام إدراج وتعديل وطباعة بطاقات الطلاب الذكية</div>
    </div>
  </header>

  <div class="main-container">
    
    <div class="control-panel">
      <div class="panel-title">✏️ بيانات الطالب والبطاقة</div>

      <div class="form-group">
        <label>الاسم الكامل</label>
        <input type="text" id="inputName" value="MOHAMED BENALI" oninput="renderCardsGrid()">
      </div>
      
      <div class="form-group">
        <label>المستوى الدراسي</label>
        <select id="inputLevel" onchange="renderCardsGrid()">
          <option value="1ST HIGH SCHOOL (1AS)">1AS - السنة الأولى ثانوي</option>
          <option value="2ND HIGH SCHOOL (2AS)">2AS - السنة الثانية ثانوي</option>
          <option value="3RD HIGH SCHOOL (3AS)">3AS - السنة الثالثة ثانوي</option>
        </select>
      </div>

      <div class="form-group">
        <label>الرقم التعريفي (ID)</label>
        <input type="text" id="inputId" value="2026-0089" oninput="renderCardsGrid()">
      </div>

      <div class="form-group">
        <label>تاريخ الانتهاء</label>
        <input type="text" id="inputExpire" value="06 / 2027" oninput="renderCardsGrid()">
      </div>

      <div class="action-section">
        <button class="btn-action btn-batch" onclick="saveCurrentToDb()">💾 حفظ البطاقة / التعديلات</button>
        <button class="btn-action btn-print-batch" onclick="triggerPrint()">🖨️ طباعة (Recto / Verso)</button>
        <button class="btn-action btn-download" onclick="downloadCurrentCard()">📥 تنزيل البطاقة الحالية (PNG)</button>
        <button class="btn-action btn-clear" onclick="clearDatabase()">🗑️ مسح كافة البيانات</button>
      </div>
    </div>

    <div class="workspace">
      <div class="cards-grid" id="cardsGrid"></div>
    </div>

  </div>

  <script>
    let database = [{
      name: "MOHAMED BENALI",
      level: "1ST HIGH SCHOOL (1AS)",
      id: "2026-0089",
      expire: "06 / 2027",
      photo: ""
    }];

    let fallbackBackImage = `data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="480" height="300" viewBox="0 0 480 300"><rect width="480" height="300" fill="%230f172a"/><circle cx="240" cy="150" r="80" fill="none" stroke="%2306b6d4" stroke-width="2" opacity="0.4"/><text x="50%" y="48%" dominant-baseline="middle" text-anchor="middle" fill="%2306b6d4" font-size="20" font-family="sans-serif" font-weight="bold">EL OULA SCHOOL</text><text x="50%" y="62%" dominant-baseline="middle" text-anchor="middle" fill="%23ffffff" font-size="12" font-family="sans-serif">SMART CARD BACK VIEW</text></svg>`;

    window.addEventListener('DOMContentLoaded', () => {
      renderCardsGrid();
    });

    function renderCardsGrid() {
      const grid = document.getElementById('cardsGrid');
      grid.innerHTML = '';

      database.forEach((item, idx) => {
        const cardBox = document.createElement('div');
        cardBox.className = 'card-box';
        
        cardBox.innerHTML = `
          <!-- الوجه الأمامي (Recto) -->
          <div class="card-wrapper" id="card-front-${idx}">
            <img src="1_2.png" class="card-template-img" onerror="this.src='https://via.placeholder.com/480x300/0f172a/06b6d4?text=Front+Card'">
            ${item.photo ? `<img class="student-photo" src="${item.photo}">` : ''}
            <div class="field-overlay valName">${item.name}</div>
            <div class="field-overlay valLevel">${item.level}</div>
            <div class="field-overlay valId">${item.id}</div>
            <div class="field-overlay valExpire">${item.expire}</div>
          </div>

          <!-- الوجه الخلفي (Verso) -->
          <div class="card-wrapper" id="card-back-${idx}">
            <img src="2_2.png" class="card-template-img" onerror="this.src='${fallbackBackImage}'">
          </div>
        `;
        grid.appendChild(cardBox);
      });
    }

    function triggerPrint() {
      window.print();
    }

    function saveCurrentToDb() {
      const name = document.getElementById('inputName').value.toUpperCase().trim();
      const level = document.getElementById('inputLevel').value;
      const id = document.getElementById('inputId').value.trim();
      const expire = document.getElementById('inputExpire').value.trim();

      if (!name || !id) return alert('يرجى ملء الاسم و ID');

      database[0] = { name, level, id, expire, photo: database[0].photo };
      renderCardsGrid();
      alert('تم حفظ البيانات بنجاح!');
    }

    function downloadCurrentCard() {
      const cardFront = document.querySelector('.card-wrapper');
      html2canvas(cardFront, { scale: 2 }).then(canvas => {
        const link = document.createElement('a');
        link.download = `Student_Card.png`;
        link.href = canvas.toDataURL('image/png');
        link.click();
      });
    }

    function clearDatabase() {
      document.getElementById('inputName').value = '';
      document.getElementById('inputId').value = '';
      database = [];
      renderCardsGrid();
    }
  </script>

</body>
</html>
