<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EL OULA SCHOOL - Smart ID Portal</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=Poppins:wght@700;800;900&display=swap" rel="stylesheet">
  
  <!-- Libraries -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>

  <style>
    :root {
      --primary-cyan: #06b6d4;
      --accent-purple: #8b5cf6;
      --accent-pink: #ec4899;
      --accent-green: #10b981;
      --glass-bg: rgba(15, 23, 42, 0.55);
      --glass-border: rgba(255, 255, 255, 0.15);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }

    body {
      background-color: #030712;
      min-height: 100vh;
      color: #f8fafc;
      padding-bottom: 60px;
      position: relative;
      overflow-x: hidden;
    }

    .bg-pattern {
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      z-index: 0;
      background-color: #030712;
      background-image: 
        radial-gradient(circle at 50% 50%, rgba(139, 92, 246, 0.15) 0%, transparent 70%),
        radial-gradient(rgba(255, 255, 255, 0.12) 1.5px, transparent 1.5px);
      background-size: 100% 100%, 35px 35px;
      pointer-events: none;
    }

    .glowing-orb {
      position: fixed;
      border-radius: 50%;
      filter: blur(80px);
      z-index: 0;
      opacity: 0.7;
      pointer-events: none;
      animation: moveAndPulse 10s infinite alternate ease-in-out;
    }

    .orb-1 { width: 450px; height: 450px; background: var(--accent-purple); top: -100px; right: -50px; }
    .orb-2 { width: 500px; height: 500px; background: var(--primary-cyan); bottom: -100px; left: -50px; animation-delay: -5s; }

    @keyframes moveAndPulse {
      0% { transform: translate(0, 0) scale(0.85); opacity: 0.4; }
      100% { transform: translate(80px, 60px) scale(1.2); opacity: 0.5; }
    }

    header {
      width: 100%;
      padding: 2rem 1rem;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      position: relative;
      z-index: 10;
    }

    .header-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      max-width: 600px;
    }

    .header-logo {
      width: 120px;
      height: 120px;
      object-fit: contain;
      filter: drop-shadow(0 0 20px rgba(6, 182, 212, 0.7));
      margin-bottom: 10px;
    }

    .site-title {
      font-size: 2.2rem;
      font-weight: 900;
      color: #ffffff;
      font-family: 'Poppins', sans-serif;
      letter-spacing: 2px;
    }

    .site-subtitle {
      font-size: 0.95rem;
      color: var(--primary-cyan);
      font-weight: 700;
      margin-top: 4px;
    }

    .main-container {
      max-width: 1400px;
      margin: 10px auto;
      padding: 0 20px;
      display: grid;
      grid-template-columns: 400px 1fr;
      gap: 30px;
      position: relative;
      z-index: 10;
    }

    @media (max-width: 1024px) { .main-container { grid-template-columns: 1fr; } }

    .control-panel {
      background: var(--glass-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--glass-border);
      border-radius: 24px;
      padding: 25px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.5);
      height: fit-content;
    }

    .panel-title {
      font-size: 1.05rem;
      font-weight: 800;
      margin-bottom: 18px;
      color: var(--primary-cyan);
      border-right: 4px solid var(--primary-cyan);
      padding-right: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .save-indicator {
      font-size: 0.75rem;
      color: var(--accent-green);
      font-weight: 600;
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .save-indicator.active { opacity: 1; }

    .form-group { margin-bottom: 14px; }
    .form-group label { display: block; font-size: 0.85rem; font-weight: 700; margin-bottom: 6px; color: #cbd5e1; }
    .form-group input, .form-group select {
      width: 100%;
      padding: 10px 14px;
      border: 1px solid var(--glass-border);
      background: rgba(15, 23, 42, 0.6);
      border-radius: 12px;
      font-size: 0.9rem;
      color: #fff;
      outline: none;
      transition: all 0.3s;
    }
    .form-group select option { background: #0f172a; color: #fff; }
    .form-group input:focus, .form-group select:focus {
      border-color: var(--primary-cyan);
      box-shadow: 0 0 15px rgba(6, 182, 212, 0.4);
    }

    .batch-upload-box {
      border: 2px dashed var(--primary-cyan);
      background: rgba(6, 182, 212, 0.08);
      border-radius: 16px;
      padding: 15px;
      text-align: center;
      margin-bottom: 18px;
    }

    .batch-upload-box p { font-size: 0.8rem; color: #94a3b8; margin-top: 6px; }

    .action-section {
      margin-top: 15px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .btn-action {
      position: relative;
      width: 100%;
      padding: 14px 18px;
      border: 1px solid var(--glass-border);
      border-radius: 14px;
      color: white;
      font-weight: 800;
      font-size: 0.92rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: all 0.3s ease;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
    }

    .btn-batch { background: linear-gradient(135deg, rgba(16, 185, 129, 0.9), rgba(6, 182, 212, 0.9)); }
    .btn-print-batch { background: linear-gradient(135deg, rgba(236, 72, 153, 0.9), rgba(139, 92, 246, 0.9)); }
    .btn-print-front { background: linear-gradient(135deg, rgba(6, 182, 212, 0.8), rgba(139, 92, 246, 0.8)); }
    .btn-download { background: linear-gradient(135deg, rgba(16, 185, 129, 0.8), rgba(6, 182, 212, 0.8)); }
    .btn-clear { background: rgba(239, 68, 68, 0.35); border-color: rgba(239, 68, 68, 0.6); }

    .btn-action:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(6, 182, 212, 0.4);
    }

    .workspace { display: flex; flex-direction: column; gap: 20px; }

    .search-filter-bar {
      background: var(--glass-bg);
      backdrop-filter: blur(16px);
      border: 1px solid var(--glass-border);
      border-radius: 20px;
      padding: 15px 20px;
      display: flex;
      flex-wrap: wrap;
      gap: 15px;
      align-items: center;
      justify-content: space-between;
    }

    .search-input-group { flex: 1; min-width: 250px; }

    .search-input {
      width: 100%;
      padding: 10px 16px;
      background: rgba(15, 23, 42, 0.5);
      border: 1px solid var(--glass-border);
      border-radius: 12px;
      color: white;
      font-weight: 700;
      outline: none;
    }

    .database-panel {
      background: var(--glass-bg);
      backdrop-filter: blur(16px);
      border: 1px solid var(--glass-border);
      border-radius: 20px;
      padding: 20px;
    }

    .db-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
    .db-title { font-size: 1.05rem; font-weight: 800; color: var(--primary-cyan); }

    .db-table-container {
      max-height: 220px;
      overflow-y: auto;
      border-radius: 12px;
      border: 1px solid var(--glass-border);
    }

    .db-table { width: 100%; border-collapse: collapse; text-align: right; font-size: 0.85rem; }
    .db-table th { background: rgba(6, 182, 212, 0.2); padding: 10px; color: #fff; position: sticky; top: 0; }
    .db-table td { padding: 10px; border-bottom: 1px solid rgba(255,255,255,0.08); color: #e2e8f0; }

    .btn-table-edit {
      background: rgba(6, 182, 212, 0.2);
      border: 1px solid var(--primary-cyan);
      color: #38bdf8;
      padding: 4px 10px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 700;
    }

    .btn-table-delete {
      background: rgba(239, 68, 68, 0.2);
      border: 1px solid #ef4444;
      color: #f87171;
      padding: 4px 10px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 700;
      margin-right: 4px;
    }

    .cards-grid { display: flex; flex-direction: column; gap: 30px; align-items: center; }

    .card-box {
      display: flex;
      flex-direction: row;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      gap: 20px;
      background: rgba(255,255,255,0.02);
      padding: 20px;
      border-radius: 20px;
      border: 1px solid var(--glass-border);
      width: 100%;
    }

    .card-header-bar {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 10px;
      border-bottom: 1px solid rgba(255,255,255,0.1);
    }

    .card-wrapper {
      position: relative;
      width: 480px;
      height: 300px;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 15px 35px rgba(0,0,0,0.8);
      border: 1px solid rgba(255,255,255,0.25);
      background: #0f172a;
    }

    .card-template-img {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      object-fit: cover;
      z-index: 1;
    }

    .student-photo {
      position: absolute;
      top: 125px; left: 30px;
      width: 108px; height: 116px;
      object-fit: cover;
      border-radius: 4px;
      z-index: 2;
    }

    .field-overlay {
      position: absolute;
      font-weight: 900 !important;
      color: #000;
      font-size: 13px;
      font-family: 'Poppins', sans-serif;
      white-space: nowrap;
      z-index: 3;
    }

    .valName   { top: 110px; left: 235px; }
    .valLevel  { top: 164px; left: 235px; } 
    .valId     { top: 192px; left: 235px; } 
    .valExpire { top: 246px; left: 235px; }

    @media print {
      * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
      body { background: white !important; color: black !important; padding: 0 !important; }
      body * { visibility: hidden; }
      .cards-grid, .cards-grid * { visibility: visible; }
      .cards-grid { position: absolute; top: 0; left: 0; width: 100%; }
      .card-box { page-break-after: always; break-after: page; border: none !important; background: transparent !important; }
      header, .control-panel, .search-filter-bar, .database-panel, .bg-pattern, .glowing-orb, .card-header-bar { display: none !important; }
    }
  </style>
</head>
<body>

  <div class="bg-pattern"></div>
  <div class="glowing-orb orb-1"></div>
  <div class="glowing-orb orb-2"></div>

  <header>
    <div class="header-content">
      <!-- 🖼️ صورة اللوجو -->
      <img src="Untitled design_2.png" alt="Logo" class="header-logo" onerror="this.style.display='none'">
      <div class="site-title">EL OULA SCHOOL</div>
      <div class="site-subtitle">نظام إدراج وتعديل وطباعة بطاقات الطلاب الذكية</div>
    </div>
  </header>

  <div class="main-container">
    
    <div class="control-panel">
      
      <div class="panel-title">
        <span>📂 رفع ملف دفعة (Excel / PDF)</span>
        <span class="save-indicator" id="saveNotice">✔ تم الحفظ</span>
      </div>

      <div class="batch-upload-box">
        <label style="cursor:pointer; font-weight:800; color:var(--primary-cyan);">
          📂 اضغط هنا لرفع ملف Excel أو PDF
          <input type="file" id="batchFileInput" accept=".xlsx, .xls, .csv, .pdf" style="display:none;" onchange="handleBatchFileUpload(event)">
        </label>
        <p>يستخرج بيانات الطلاب تلقائياً إلى قاعدة البيانات</p>
      </div>

      <div class="panel-title">
        <span id="formModeTitle">✏️ إضافة / تعديل بطاقة</span>
      </div>

      <input type="hidden" id="editingId" value="">

      <div class="form-group">
        <label>الاسم الكامل</label>
        <input type="text" id="inputName" value="MOHAMED BENALI" oninput="livePreviewSingleCard()">
      </div>
      
      <div class="form-group">
        <label>المستوى الدراسي</label>
        <select id="inputLevel" onchange="livePreviewSingleCard()">
          <optgroup label="الطور الابتدائي">
            <option value="1ST PRIMARY SCHOOL (1AP)">1AP - السنة الأولى ابتدائي</option>
            <option value="2ND PRIMARY SCHOOL (2AP)">2AP - السنة الثانية ابتدائي</option>
            <option value="3RD PRIMARY SCHOOL (3AP)">3AP - السنة الثالثة ابتدائي</option>
            <option value="4TH PRIMARY SCHOOL (4AP)">4AP - السنة الرابعة ابتدائي</option>
            <option value="5TH PRIMARY SCHOOL (5AP)">5AP - السنة الخامسة ابتدائي</option>
          </optgroup>
          <optgroup label="الطور المتوسط">
            <option value="1ST MIDDLE SCHOOL (1AM)">1AM - السنة الأولى متوسط</option>
            <option value="2ND MIDDLE SCHOOL (2AM)">2AM - السنة الثانية متوسط</option>
            <option value="3RD MIDDLE SCHOOL (3AM)">3AM - السنة الثالثة متوسط</option>
            <option value="4TH MIDDLE SCHOOL (4AM)">4AM - السنة الرابعة متوسط</option>
          </optgroup>
          <optgroup label="الطور الثانوي">
            <option value="1ST HIGH SCHOOL (1AS)" selected>1AS - السنة الأولى ثانوي</option>
            <option value="2ND HIGH SCHOOL (2AS)">2AS - السنة الثانية ثانوي</option>
            <option value="3RD HIGH SCHOOL (3AS)">3AS - السنة الثالثة ثانوي</option>
          </optgroup>
        </select>
      </div>

      <div class="form-group">
        <label>الرقم التعريفي (ID)</label>
        <input type="text" id="inputId" value="2026-0089" oninput="livePreviewSingleCard()">
      </div>

      <div class="form-group">
        <label>تاريخ الانتهاء</label>
        <input type="text" id="inputExpire" value="06 / 2027" oninput="livePreviewSingleCard()">
      </div>

      <div class="form-group">
        <label>الصورة الشخصية</label>
        <input type="file" id="inputPhoto" accept="image/*" onchange="previewPhoto(event)">
      </div>

      <div class="action-section">
        <button type="button" class="btn-action btn-batch" onclick="saveCurrentToDb()">
          <span id="btnSaveText">💾 حفظ البطاقة / التعديلات</span>
        </button>
        <button type="button" class="btn-action btn-print-batch" onclick="printAllBatch()">
          <span>🖨️</span> طباعة كل البطاقات (Recto / Verso)
        </button>
        <button type="button" class="btn-action btn-print-front" onclick="window.print()">
          <span>🖨️</span> طباعة المعاينة الحالية (Recto / Verso)
        </button>
        <button type="button" class="btn-action btn-download" onclick="downloadCurrentCard()">
          <span>📥</span> تنزيل البطاقة الحالية (PNG)
        </button>
        <button type="button" class="btn-action btn-clear" onclick="clearDatabase()">
          <span>🗑️</span> مسح كافة البيانات والبطاقات
        </button>
      </div>

    </div>

    <div class="workspace">
      
      <div class="search-filter-bar">
        <div class="search-input-group">
          <input type="text" class="search-input" id="searchBox" placeholder="🔍 البحث بـ ID أو الاسم..." onkeyup="filterCardsAndDb()">
        </div>
      </div>

      <!-- 🗄️ قاعدة البيانات -->
      <div class="database-panel">
        <div class="db-header">
          <div class="db-title">📊 البطاقات المسجلة</div>
          <div id="dbCount" style="font-size:0.85rem; color:#94a3b8;">إجمالي المسجلين: 0</div>
        </div>
        <div class="db-table-container">
          <table class="db-table">
            <thead>
              <tr>
                <th>#</th>
                <th>الاسم الكامل</th>
                <th>الرقم التعريفي</th>
                <th>المستوى الدراسي</th>
                <th>تاريخ الانتهاء</th>
                <th>الإجراءات</th>
              </tr>
            </thead>
            <tbody id="dbTableBody"></tbody>
          </table>
        </div>
      </div>

      <!-- شبكة عرض البطاقات -->
      <div class="cards-grid" id="cardsGrid"></div>

    </div>

  </div>

  <script>
    let database = [];
    let currentPhotoBase64 = '';

    const defaultBackSVG = `data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="480" height="300" viewBox="0 0 480 300"><rect width="480" height="300" fill="%230f172a"/><path d="0 0 L480 300 L0 300 Z" fill="%231e1b4b" opacity="0.5"/><circle cx="240" cy="150" r="80" fill="none" stroke="%2306b6d4" stroke-width="2" opacity="0.3"/><text x="50%" y="45%" dominant-baseline="middle" text-anchor="middle" fill="%2306b6d4" font-size="20" font-family="sans-serif" font-weight="bold">EL OULA SCHOOL</text><text x="50%" y="60%" dominant-baseline="middle" text-anchor="middle" fill="%23ffffff" font-size="12" font-family="sans-serif">SMART STUDENT CARD - BACK VIEW</text></svg>`;

    window.addEventListener('DOMContentLoaded', () => {
      pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';
      
      const savedDb = localStorage.getItem('studentDatabase');
      if (savedDb) {
        database = JSON.parse(savedDb);
      } else {
        database = [{
          name: "MOHAMED BENALI",
          level: "1ST HIGH SCHOOL (1AS)",
          id: "2026-0089",
          expire: "06 / 2027",
          photo: ""
        }];
      }
      renderDatabaseTable();
      renderCardsGrid();
    });

    function saveDatabase() {
      localStorage.setItem('studentDatabase', JSON.stringify(database));
      renderDatabaseTable();
      renderCardsGrid();
    }

    function renderDatabaseTable() {
      const tbody = document.getElementById('dbTableBody');
      const searchVal = document.getElementById('searchBox').value.toLowerCase();
      tbody.innerHTML = '';

      let count = 0;
      database.forEach((item, index) => {
        if (item.name.toLowerCase().includes(searchVal) || item.id.toLowerCase().includes(searchVal)) {
          count++;
          const tr = document.createElement('tr');
          tr.innerHTML = `
            <td>${index + 1}</td>
            <td><strong>${item.name}</strong></td>
            <td>${item.id}</td>
            <td>${item.level}</td>
            <td>${item.expire}</td>
            <td>
              <button class="btn-table-edit" onclick="editStudent('${item.id}')">✏️ تعديل</button>
              <button class="btn-table-delete" onclick="deleteStudent('${item.id}')">🗑️ حذف</button>
            </td>
          `;
          tbody.appendChild(tr);
        }
      });

      document.getElementById('dbCount').innerText = `إجمالي المسجلين: ${count}`;
    }

    function renderCardsGrid() {
      const grid = document.getElementById('cardsGrid');
      const searchVal = document.getElementById('searchBox').value.toLowerCase();
      grid.innerHTML = '';

      database.forEach((item, idx) => {
        if (item.name.toLowerCase().includes(searchVal) || item.id.toLowerCase().includes(searchVal)) {
          const cardBox = document.createElement('div');
          cardBox.className = 'card-box';
          
          cardBox.innerHTML = `
            <div class="card-header-bar">
              <span style="color:var(--primary-cyan); font-weight:800;">بطاقة الطالب #${idx + 1}: ${item.name}</span>
              <button class="btn-table-edit" onclick="editStudent('${item.id}')">✏️ تعديل</button>
            </div>
            
            <!-- الوجه الأمامي (Recto) -->
            <div class="card-wrapper" id="card-front-${idx}">
              <img src="1_2.png" class="card-template-img" alt="Card Front" onerror="this.src='https://via.placeholder.com/480x300/0f172a/06b6d4?text=Card+Front+Template'">
              ${item.photo ? `<img class="student-photo" src="${item.photo}">` : `<img class="student-photo" style="display:none;">`}
              <div class="field-overlay valName">${item.name}</div>
              <div class="field-overlay valLevel">${item.level}</div>
              <div class="field-overlay valId">${item.id}</div>
              <div class="field-overlay valExpire">${item.expire}</div>
            </div>

            <!-- الوجه الخلفي (Verso) - تم تعديل المسار لـ 2_2.png -->
            <div class="card-wrapper" id="card-back-${idx}">
              <img src="2_2.png" class="card-template-img" alt="Card Back" onerror="this.src='${defaultBackSVG}'">
            </div>
          `;
          grid.appendChild(cardBox);
        }
      });
    }

    function editStudent(studentId) {
      const student = database.find(s => s.id === studentId);
      if (!student) return;

      document.getElementById('editingId').value = student.id;
      document.getElementById('inputName').value = student.name;
      document.getElementById('inputLevel').value = student.level;
      document.getElementById('inputId').value = student.id;
      document.getElementById('inputExpire').value = student.expire;
      currentPhotoBase64 = student.photo || '';

      document.getElementById('formModeTitle').innerText = `✏️ تعديل بطاقة: ${student.name}`;
      document.getElementById('btnSaveText').innerText = `💾 حفظ التعديلات`;
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function deleteStudent(studentId) {
      if (confirm(`تأكيد حذف الطالب صاحب الرقم ${studentId}؟`)) {
        database = database.filter(s => s.id !== studentId);
        saveDatabase();
      }
    }

    function livePreviewSingleCard() {
      const editingId = document.getElementById('editingId').value;
      if (editingId) {
        const idx = database.findIndex(s => s.id === editingId);
        if (idx >= 0) {
          database[idx].name = document.getElementById('inputName').value.toUpperCase();
          database[idx].level = document.getElementById('inputLevel').value;
          database[idx].id = document.getElementById('inputId').value;
          database[idx].expire = document.getElementById('inputExpire').value;
          if (currentPhotoBase64) database[idx].photo = currentPhotoBase64;
          renderDatabaseTable();
          renderCardsGrid();
        }
      }
    }

    function previewPhoto(event) {
      const file = event.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(e) {
          currentPhotoBase64 = e.target.result;
          livePreviewSingleCard();
        };
        reader.readAsDataURL(file);
      }
    }

    function saveCurrentToDb() {
      const editingId = document.getElementById('editingId').value;
      const name = document.getElementById('inputName').value.toUpperCase().trim();
      const level = document.getElementById('inputLevel').value;
      const id = document.getElementById('inputId').value.trim();
      const expire = document.getElementById('inputExpire').value.trim();

      if (!name || !id) {
        alert('الرجاء إدخال الاسم والرقم التعريفي');
        return;
      }

      if (editingId) {
        const index = database.findIndex(s => s.id === editingId);
        if (index >= 0) {
          database[index] = { name, level, id, expire, photo: currentPhotoBase64 || database[index].photo };
        }
        document.getElementById('editingId').value = '';
        document.getElementById('formModeTitle').innerText = `✏️ إضافة / تعديل بطاقة`;
        document.getElementById('btnSaveText').innerText = `💾 حفظ البطاقة / التعديلات`;
      } else {
        const existingIndex = database.findIndex(item => item.id === id);
        if (existingIndex >= 0) {
          database[existingIndex] = { name, level, id, expire, photo: currentPhotoBase64 || database[existingIndex].photo };
        } else {
          database.push({ name, level, id, expire, photo: currentPhotoBase64 });
        }
      }

      currentPhotoBase64 = '';
      document.getElementById('inputPhoto').value = '';
      saveDatabase();
      showSaveNotice();
    }

    function showSaveNotice() {
      const notice = document.getElementById('saveNotice');
      notice.classList.add('active');
      setTimeout(() => notice.classList.remove('active'), 2000);
    }

    function handleBatchFileUpload(event) {
      const file = event.target.files[0];
      if (!file) return;

      const fileName = file.name.toLowerCase();
      if (fileName.endsWith('.xlsx') || fileName.endsWith('.xls') || fileName.endsWith('.csv')) {
        parseExcel(file);
      } else if (fileName.endsWith('.pdf')) {
        parsePDF(file);
      } else {
        alert('يرجى اختيار ملف Excel أو PDF صحيح');
      }
    }

    function parseExcel(file) {
      const reader = new FileReader();
      reader.onload = function(e) {
        const data = new Uint8Array(e.target.result);
        const workbook = XLSX.read(data, { type: 'array' });
        const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
        const jsonData = XLSX.utils.sheet_to_json(firstSheet, { header: 1 });

        for (let i = 1; i < jsonData.length; i++) {
          const row = jsonData[i];
          if (row && row.length >= 2) {
            const name = String(row[0] || '').trim().toUpperCase();
            const id = String(row[1] || '').trim();
            const level = String(row[2] || '1ST HIGH SCHOOL (1AS)').trim();
            const expire = String(row[3] || '06 / 2027').trim();

            if (name && id) {
              const existingIndex = database.findIndex(item => item.id === id);
              if (existingIndex >= 0) {
                database[existingIndex].name = name;
              } else {
                database.push({ name, level, id, expire, photo: '' });
              }
            }
          }
        }
        saveDatabase();
        alert('تم رفع واستخراج بيانات Excel بنجاح!');
      };
      reader.readAsArrayBuffer(file);
    }

    function parsePDF(file) {
      const reader = new FileReader();
      reader.onload = function(e) {
        const typedarray = new Uint8Array(e.target.result);
        pdfjsLib.getDocument(typedarray).promise.then(pdf => {
          let maxPages = pdf.numPages;
          let count = 0;
          for (let p = 1; p <= maxPages; p++) {
            pdf.getPage(p).then(page => {
              page.getTextContent().then(textContent => {
                const text = textContent.items.map(item => item.str).join(' ');
                const matches = text.match(/([A-Z\s]{4,20})\s+(\d{4}-\d{4}|\d{5,10})/g);
                if (matches) {
                  matches.forEach(m => {
                    const parts = m.trim().split(/\s+/);
                    if (parts.length >= 2) {
                      const id = parts.pop();
                      const name = parts.join(' ');
                      database.push({ name: name.toUpperCase(), level: '1ST HIGH SCHOOL (1AS)', id, expire: '06 / 2027', photo: '' });
                    }
                  });
                }
                count++;
                if (count === maxPages) {
                  saveDatabase();
                  alert('تمت قراءة ملف PDF بنجاح!');
                }
              });
            });
          }
        });
      };
      reader.readAsArrayBuffer(file);
    }

    function printAllBatch() {
      if (database.length === 0) {
        alert('لا توجد بطاقات للطباعة');
        return;
      }
      window.print();
    }

    function filterCardsAndDb() {
      renderDatabaseTable();
      renderCardsGrid();
    }

    function downloadCurrentCard() {
      const cardFront = document.querySelector('.card-wrapper');
      if (!cardFront) {
        alert('لا توجد بطاقة حالياً لتنزيلها');
        return;
      }

      html2canvas(cardFront, { scale: 3, useCORS: true, allowTaint: true }).then(canvas => {
        const link = document.createElement('a');
        link.download = `Student_Card_${document.getElementById('inputId').value || 'ID'}.png`;
        link.href = canvas.toDataURL('image/png');
        link.click();
      }).catch(err => {
        alert('حدث خطأ أثناء تنزيل الصورة، يرجى المحاولة لاحقاً');
      });
    }

    function clearDatabase() {
      if (confirm('هل أنت متأكد من مسح جميع البيانات والبطاقات من النظام؟')) {
        database = [];
        localStorage.removeItem('studentDatabase');
        document.getElementById('inputName').value = '';
        document.getElementById('inputId').value = '';
        renderDatabaseTable();
        renderCardsGrid();
      }
    }
  </script>

</body>
