<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EL OULA SCHOOL - Card Generator Tool</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=Poppins:wght@700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #090d16 0%, #111827 50%, #1e293b 100%);
      --glass-card: rgba(30, 41, 59, 0.7);
      --glass-border: rgba(255, 255, 255, 0.12);
      --primary-cyan: #38bdf8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }

    body {
      background: var(--bg-gradient);
      min-height: 100vh;
      color: #f8fafc;
      padding-bottom: 60px;
    }

    header {
      background: rgba(15, 23, 42, 0.9);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--glass-border);
      padding: 2rem 1rem;
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.6);
    }

    .header-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      gap: 12px;
    }

    .header-logo {
      width: 130px;
      height: 130px;
      object-fit: contain;
      background: #ffffff;
      border-radius: 24px;
      padding: 10px;
      box-shadow: 0 0 35px rgba(56, 189, 248, 0.25);
      border: 3px solid rgba(255, 255, 255, 0.9);
    }

    .site-title {
      font-size: 2.2rem;
      font-weight: 900;
      color: #ffffff;
      font-family: 'Poppins', sans-serif;
      letter-spacing: 2px;
    }

    .site-subtitle {
      font-size: 0.9rem;
      color: var(--primary-cyan);
      font-weight: 700;
      letter-spacing: 1px;
    }

    .main-container {
      max-width: 1400px;
      margin: 30px auto;
      padding: 0 20px;
      display: grid;
      grid-template-columns: 380px 1fr;
      gap: 30px;
    }

    @media (max-width: 1024px) { .main-container { grid-template-columns: 1fr; } }

    .control-panel {
      background: var(--glass-card);
      backdrop-filter: blur(16px);
      border: 1px solid var(--glass-border);
      border-radius: 20px;
      padding: 25px;
    }

    .panel-title {
      font-size: 1.1rem;
      font-weight: 800;
      margin-bottom: 18px;
      color: var(--primary-cyan);
      border-right: 4px solid var(--primary-cyan);
      padding-right: 10px;
    }

    .form-group { margin-bottom: 15px; }
    .form-group label { display: block; font-size: 0.85rem; font-weight: 700; margin-bottom: 6px; color: #cbd5e1; }
    .form-group input {
      width: 100%;
      padding: 10px 14px;
      border: 1px solid var(--glass-border);
      background: rgba(15, 23, 42, 0.8);
      border-radius: 10px;
      font-size: 0.9rem;
      color: #fff;
      outline: none;
    }

    .btn-action {
      width: 100%;
      padding: 12px;
      background: linear-gradient(135deg, #0284c7, #2563eb);
      border: none;
      border-radius: 10px;
      color: white;
      font-weight: 800;
      cursor: pointer;
      margin-top: 10px;
    }

    .workspace {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .search-filter-bar {
      background: var(--glass-card);
      border: 1px solid var(--glass-border);
      border-radius: 16px;
      padding: 15px 20px;
      display: flex;
      flex-wrap: wrap;
      gap: 15px;
      align-items: center;
      justify-content: space-between;
    }

    .search-input {
      flex: 1;
      min-width: 250px;
      padding: 10px 16px;
      background: rgba(15, 23, 42, 0.9);
      border: 1px solid var(--primary-cyan);
      border-radius: 10px;
      color: white;
      font-weight: 700;
      outline: none;
    }

    .level-tabs {
      display: flex;
      gap: 10px;
      overflow-x: auto;
    }

    .tab-btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--glass-border);
      color: #e2e8f0;
      padding: 8px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 700;
    }

    .tab-btn.active {
      background: var(--primary-cyan);
      color: #090d16;
    }

    .cards-grid {
      display: flex;
      flex-direction: column;
      gap: 40px;
      align-items: center;
    }

    .card-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    /* حاوي البطاقة الهيكلي */
    .card-wrapper {
      position: relative;
      width: 500px;
      height: 315px;
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 15px 35px rgba(0,0,0,0.8);
      border: 1px solid rgba(255,255,255,0.2);
    }

    /* صورة تصميم البطاقة الثابتة بدلاً من background-image */
    .card-template-img {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: fill;
      z-index: 1;
    }

    .student-photo {
      position: absolute;
      top: 132px; left: 31px;
      width: 112px; height: 122px;
      object-fit: cover;
      border-radius: 4px;
      z-index: 2;
    }

    .field-overlay {
      position: absolute;
      font-weight: 900 !important;
      color: #000;
      font-size: 13.5px;
      font-family: 'Poppins', sans-serif;
      white-space: nowrap;
      z-index: 3;
    }

    #valName   { top: 115px; left: 245px; }
    #valLevel  { top: 172px; left: 245px; } 
    #valId     { top: 201px; left: 245px; } 
    #valExpire { top: 258px; left: 245px; }

    .zoom-btn {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid var(--glass-border);
      color: #fff;
      padding: 4px 10px;
      border-radius: 6px;
      cursor: pointer;
    }

    /* إعدادات الطباعة الإجبارية */
    @media print {
      * {
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
      }

      body {
        background: none !important;
        padding: 0 !important;
      }

      body * { visibility: hidden; }

      .cards-grid, .cards-grid * { visibility: visible; }

      .cards-grid {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        display: block !important;
      }

      .card-box {
        page-break-inside: avoid;
        margin-bottom: 20px;
      }

      .card-wrapper {
        box-shadow: none !important;
        border: none !important;
        transform: scale(1) !important;
      }

      header, .search-filter-bar, .control-panel, .zoom-controls {
        display: none !important;
      }
    }
  </style>
</head>
<body>

  <header>
    <div class="header-content">
      <img src="Untitled design_2.png" alt="Logo" class="header-logo" onerror="this.src='https://via.placeholder.com/130?text=EL+OULA'">
      <div class="site-title">EL OULA SCHOOL</div>
      <div class="site-subtitle">موقع إنشاء وطباعة بطاقات الطلاب الذكية</div>
    </div>
  </header>

  <div class="main-container">
    
    <div class="control-panel">
      <div class="panel-title">📁 استيراد الملفات (PDF/Excel)</div>
      <div class="form-group">
        <input type="file" id="bulkUpload" accept=".xlsx, .csv, .pdf">
      </div>

      <div class="panel-title">✏️ بيانات الطالب الحالية</div>
      <div class="form-group">
        <label>الاسم الكامل</label>
        <input type="text" id="inputName" value="MOHAMED BENALI" oninput="updateCard()">
      </div>
      <div class="form-group">
        <label>المستوى الدراسي</label>
        <input type="text" id="inputLevel" value="2ND YEAR HIGH SCHOOL" oninput="updateCard()">
      </div>
      <div class="form-group">
        <label>الرقم التعريفي (ID)</label>
        <input type="text" id="inputId" value="2026-0089" oninput="updateCard()">
      </div>
      <div class="form-group">
        <label>تاريخ الانتهاء</label>
        <input type="text" id="inputExpire" value="06 / 2027" oninput="updateCard()">
      </div>
      <div class="form-group">
        <label>الصورة الشخصية</label>
        <input type="file" id="inputPhoto" accept="image/*" onchange="previewPhoto(event)">
      </div>

      <button class="btn-action" onclick="window.print()">🖨️ طباعة البطاقات المعروضة</button>
    </div>

    <div class="workspace">
      
      <div class="search-filter-bar">
        <input type="text" class="search-input" placeholder="🔍 ابحث بالـ ID أو Barcode...">
        <div class="level-tabs">
          <button class="tab-btn active">الكل</button>
          <button class="tab-btn">السنة الأولى</button>
          <button class="tab-btn">السنة الثانية</button>
          <button class="tab-btn">السنة الثالثة</button>
        </div>
      </div>

      <div class="cards-grid">
        
        <!-- الوجه الأمامي -->
        <div class="card-box">
          <div class="zoom-controls">
            <span>الوجه الأمامي</span>
            <button class="zoom-btn" onclick="zoom('frontCard', 0.1)">+</button>
            <button class="zoom-btn" onclick="zoom('frontCard', -0.1)">-</button>
          </div>
          <div class="card-wrapper" id="frontCard">
            <!-- صورة تصميم البطاقة كعنصر img مستقل للطباعة الإجبارية -->
            <img src="1_2.png" class="card-template-img" alt="Card Front">
            
            <img id="cardPhoto" class="student-photo" src="" style="display:none;">
            <div class="field-overlay" id="valName">BENALI MOHAMED</div>
            <div class="field-overlay" id="valLevel">2ND YEAR HIGH SCHOOL</div>
            <div class="field-overlay" id="valId">2026-0089</div>
            <div class="field-overlay" id="valExpire">06 / 2027</div>
          </div>
        </div>

        <!-- الظهر -->
        <div class="card-box">
          <div class="zoom-controls">
            <span>الظهر</span>
            <button class="zoom-btn" onclick="zoom('backCard', 0.1)">+</button>
            <button class="zoom-btn" onclick="zoom('backCard', -0.1)">-</button>
          </div>
          <div class="card-wrapper" id="backCard">
            <img src="2_2.png" class="card-template-img" alt="Card Back">
          </div>
        </div>

      </div>

    </div>

  </div>

  <script>
    const scales = { frontCard: 1, backCard: 1 };

    function zoom(id, delta) {
      scales[id] = Math.min(Math.max(0.7, scales[id] + delta), 1.5);
      document.getElementById(id).style.transform = `scale(${scales[id]})`;
    }

    function updateCard() {
      document.getElementById('valName').innerText = document.getElementById('inputName').value.toUpperCase() || 'BENALI MOHAMED';
      document.getElementById('valLevel').innerText = document.getElementById('inputLevel').value.toUpperCase() || '2ND YEAR HIGH SCHOOL';
      document.getElementById('valId').innerText = document.getElementById('inputId').value || '2026-0089';
      document.getElementById('valExpire').innerText = document.getElementById('inputExpire').value || '06 / 2027';
    }

    function previewPhoto(event) {
      const file = event.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(e) {
          const img = document.getElementById('cardPhoto');
          img.src = e.target.result;
          img.style.display = 'block';
        }
        reader.readAsDataURL(file);
      }
    }
  </script>

</body>
</html>
